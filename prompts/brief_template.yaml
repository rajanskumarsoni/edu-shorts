id: "008-rate-limiter"
topic: "Rate Limiter in System Design"
audience: "Tech enthusiasts, system design beginners, software engineers"
hook_angle: "How does BookMyShow or Ticketmaster survive 10 million simultaneous ticket clicks without server meltdown?"
analogy: "Metro station turnstile gate / digital bouncer with token counter"
format: "vertical" # "vertical" (1080x1920) or "landscape" (1920x1080)
accent: "#00F0FF"
key_points:
