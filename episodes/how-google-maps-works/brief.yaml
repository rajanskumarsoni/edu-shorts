id: "how-google-maps-works"
topic: "How Google Maps Works | System Design (गूगल मैप्स)"
audience: "Software engineers, system design interviewees, tech enthusiasts, CS students"
hook_angle: "When you tap navigate on Google Maps, how does it search billions of global road segments, compute the fastest path, and predict live traffic in under 200 milliseconds?"
analogy: "Hierarchical highway navigation: looking at city streets only near your driveway and destination, while zooming straight through cross-country expressways in between"
format: "vertical"
accent: "#00F0FF"
art_direction: "editorial"
theme: "cyberpunk"
key_points:
  - "1.0B DAU, 1M Peak QPS, 70 PB Map Data compressed"
  - "3D Oblate Spheroid to 2D Web Mercator Projection (EPSG:3857)"
  - "256x256 Vector Tiles dynamically rendered on client GPU to save 90% mobile bandwidth"
  - "Geocoding and GIS Reverse Geocoding with sub-millisecond Redis in-memory cache"
  - "Road network graph: Intersections as Nodes, Roads as directed weighted Edges"
  - "Hierarchical Level of Detail (LOD) routing tiles stored in S3 and cached in edge memory"
  - "Hierarchical A* search algorithm with Euclidean distance heuristic f(n) = g(n) + h(n)"
  - "15-second client GPS batching to preserve mobile battery and cellular radio state"
  - "1M write QPS ingestion pipeline via Apache Kafka stream into Apache Cassandra NoSQL"
  - "Machine Learning ETA neural model predicting travel times from live speeds + historical traffic"
  - "Real-time incident detection and quadtree Super-Tiles matching"
  - "Bi-directional WebSockets pushing live adaptive reroutes without client polling"
misconceptions:
  - "Google Maps runs Dijkstra across the entire globe in one shot (debunk: graph size would crash memory; hierarchical routing tiles load only relevant corridors)"
  - "Map images are heavy raster PNG downloads (debunk: vector tiles transmit mathematical geometries rendered on client GPU)"
  - "Phones stream GPS continuously every second (debunk: updates are batched every 15-30s to prevent mobile battery drain)"
facts_to_verify:
  - "Google Maps daily active users: 1+ Billion"
  - "Peak location write QPS: 1,000,000 requests/sec"
  - "Map storage footprint: ~70 Petabytes"
  - "Tile resolution: 256x256 pixels across 21 zoom levels"
  - "Routing SLA target: < 200 milliseconds"
cta: "Subscribe to Rajan का ADDA for in-depth system design and computer science explainers"
