id: "bubble-sort-algorithm"
topic: "How Bubble Sort Works (बबल सॉर्ट एल्गोरिदम)"
audience: "Computer science students, tech interview beginners, curious learners"
hook_angle: "When your phone sorts thousands of contacts or products by price in milliseconds, how does the computer actually arrange messy data?"
analogy: "School morning assembly lineup: students comparing heights with their immediate neighbor and swapping until everyone is in order"
format: "vertical"
accent: "#00F0FF"
art_direction: "editorial"
theme: "cyberpunk"
key_points:
  - "Adjacent pair comparison: compare A[j] and A[j+1]"
  - "The swap condition: if left > right, swap places"
  - "The bubbling effect: in each pass, the largest remaining element bubbles up to the end"
  - "Shrinking active zone: the unsorted arena reduces by 1 each pass (n-i-1)"
  - "Nested loop structure: outer pass loop and inner comparison loop"
  - "Best-case optimization: swapped flag enables O(n) early exit on sorted arrays"
  - "Complexity comparison: Bubble Sort O(n^2) vs QuickSort O(n log n)"
misconceptions:
  - "Bubble Sort is always O(n^2) (debunk: with an early-exit swapped flag, best case is O(n))"
  - "Elements float randomly like physical bubbles (debunk: it is strictly deterministic adjacent pair swapping)"
  - "Bubble Sort is completely useless (debunk: it is the premier algorithmic teaching model and optimal for nearly-sorted tiny buffers)"
facts_to_verify:
  - "Number of comparisons in standard pass: n * (n - 1) / 2"
  - "Best case time complexity with boolean swapped flag: O(n)"
  - "Worst case time complexity: O(n^2) with n * (n - 1) / 2 swaps"
  - "Space complexity: O(1) auxiliary memory (in-place sorting)"
cta: "Follow for visual computer science algorithms and system design breakdowns"
