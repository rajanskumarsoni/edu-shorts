pedagogy:
  audience: "Curious 15-year-old viewer fascinated by cars, rockets, and physics"
  core_question: "How can a street car fly and hit 0-60 mph in 0.81 seconds without airplane wings?"
  core_mechanism: "The Tesla Roadster SpaceX package replaces rear passenger seats with a 10,000 PSI composite pressure vessel (COPV) powering 10 cold-gas rocket thrusters that fire supersonic air jets via Newton's 3rd law (F = m_dot * v_e)."
  analogy: "Like releasing an inflated balloon: compressed gas rushing out of a supersonic nozzle pushes the car in the opposite direction with thousands of pounds of instant rocket force."
  misconceptions:
    - "The car uses jet engines with fire and fuel; it uses cold gas thrusters firing pure compressed air or nitrogen without combustion."
    - "It can fly across the city like an airplane; it can only execute short hops, hover briefly (~1-2 meters), and generate extreme ground-effect downforce."
    - "Cars can accelerate infinitely just with more motor power; normal cars are capped by rubber tire grip on asphalt, whereas rocket thrusters bypass tire traction entirely."

verified_mechanism:
  - "The rear seats are replaced by a Composite Overwrapped Pressure Vessel (COPV) rated at ~10,000 PSI (~700 bar)."
  - "10 cold gas thrusters are positioned seamlessly around the body (rear license plate, underbody floor, front fascia, side quarters)."
  - "High-pressure gas expands through supersonic de Laval nozzles, reaching exhaust speeds above 1,000 m/s (Mach 3)."
  - "Newton's 3rd Law (F = m_dot * v_e) generates pure reaction force independent of tire traction, yielding 0-60 mph in ~0.81 seconds."
  - "Downward thrusters provide vertical lift for short levitation hops or inverted track driving via 2G+ downforce suction."
  - "An onboard high-pressure electric compressor repumps the tank from the 200 kWh traction battery when depleted."

