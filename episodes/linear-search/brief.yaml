id: "linear-search"
topic: "How Linear Search Algorithm Works (लीनियर सर्च एल्गोरिदम)"
audience: "Computer science students, beginner coders, curious learners"
hook_angle: "When you look for a single name in an unsorted attendance register or printed exam list, how does a computer actually find it?"
analogy: "Classroom attendance register: scanning row-by-row from top to bottom until the name is found or the list ends"
format: "vertical"
accent: "#00F0FF"
art_direction: "editorial"
theme: "cyberpunk"
key_points:
  - "Sequential access: element-by-element inspection starting at index 0"
  - "Directional scan: moving strictly one step forward (i = i + 1) without jumping"
  - "Early exit on match: stops immediately when target is found (saved operations)"
  - "Worst-case scenario: target is at index N-1 or not present, requiring N checks"
  - "Best-case scenario: target is at index 0, requiring only 1 comparison O(1)"
  - "Works on unsorted arrays unlike Binary Search"
misconceptions:
  - "Linear search is always slow and useless (debunk: optimal for small lists, unsorted data, and hardware caches)"
  - "Computers can see all array items simultaneously (debunk: CPU registers can only compare one memory address at a time)"
facts_to_verify:
  - "Best case time complexity: O(1)"
  - "Worst case time complexity: O(n)"
  - "Average case time complexity: O(n/2) -> O(n)"
  - "Space complexity: O(1) auxiliary memory"
cta: "Follow for visual computer science algorithms and coding interview explainers"
